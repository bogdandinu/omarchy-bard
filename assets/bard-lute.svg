<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- neck + pegbox -->
  <line x1="8" y1="8" x2="13.2" y2="2.8" stroke="#4a2e14" stroke-width="2.2"/>
  <line x1="12.6" y1="2.4" x2="15" y2="1.6" stroke="#4a2e14" stroke-width="1.6"/>
  <rect x="13" y="0" width="1" height="1" fill="#e6b54a"/>
  <rect x="15" y="0" width="1" height="1" fill="#e6b54a"/>
  <rect x="14" y="3" width="1" height="1" fill="#e6b54a"/>
  <!-- body outline + wood -->
  <ellipse cx="5.8" cy="10.2" rx="5.4" ry="4.4" transform="rotate(-45 5.8 10.2)" fill="#3a220e"/>
  <ellipse cx="5.8" cy="10.2" rx="4.4" ry="3.4" transform="rotate(-45 5.8 10.2)" fill="#b8742e"/>
  <ellipse cx="4.8" cy="11.2" rx="2.2" ry="1.4" transform="rotate(-45 4.8 11.2)" fill="#d99a4a"/>
  <!-- rose (sound hole) -->
  <circle cx="7" cy="9" r="1.3" fill="#2a1608"/>
  <!-- bridge -->
  <rect x="3" y="12" width="2" height="1" fill="#3a220e"/>
  <!-- strings -->
  <line x1="4.5" y1="12" x2="13" y2="3.5" stroke="#f3e2b8" stroke-width="0.6"/>
</svg>
